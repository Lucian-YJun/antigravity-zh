[workspace]
members = [
    "crates/asar",
    "crates/replacer",
    "crates/installer",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "1.4.2"
edition = "2021"
authors = ["Antigravity Localization Team"]
license = "MIT"
repository = "https://github.com/Lucian-YJun/antigravity-zh"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
memmap2 = "0.9"
rayon = "1.10"
walkdir = "2.5"
aho-corasick = "1.1"
regex = "1.10"
sha2 = "0.10"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"

# Internal crate dependencies
antigravity-asar = { path = "crates/asar" }
antigravity-replacer = { path = "crates/replacer" }
antigravity-installer = { path = "crates/installer" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# 刻意不设 panic = "abort"：abort 会让进程立即终止且不展开栈，
# deployer.rs 的 rollback_stack 只在 Result::Err 路径执行，一旦 panic
# 就完全不会回滚，安装目录会停在半交换状态（app.asar 已改名、新目录未落位）。
# 保持默认的 unwind，配合 deploy_atomically 里的 catch_unwind，panic 也能触发回滚。
strip = true
