[workspace]
members = [
    "crates/asar",
    "crates/replacer",
    "crates/installer",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "1.3.1"
edition = "2021"
authors = ["Antigravity Localization Team"]
license = "MIT"
repository = "https://github.com/antigravity/antigravity-zh"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
memmap2 = "0.9"
rayon = "1.10"
walkdir = "2.5"
aho-corasick = "1.1"
regex = "1.10"
sha2 = "0.10"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"

# Internal crate dependencies
antigravity-asar = { path = "crates/asar" }
antigravity-replacer = { path = "crates/replacer" }
antigravity-installer = { path = "crates/installer" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
